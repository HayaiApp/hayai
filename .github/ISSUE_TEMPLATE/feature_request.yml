name: 🌟 Feature request
description: Suggest a feature to improve Hayai
labels: [enhancement]
body:

  - type: textarea
    id: feature-description
    attributes:
      label: Describe your suggested feature
      description: What problem should Hayai solve, and how should it behave?
      placeholder: |
        Example:
          "It should work like this..."
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      placeholder: |
        Additional details and attachments.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Read this carefully, we will close and ignore your issue if you skimmed through this.
      options:
        - label: I have searched the existing issues and this is a new ticket, **NOT** a duplicate or related to another open issue.
          required: true
        - label: I have written a short but informative title.
          required: true
        - label: I have checked the [Hayai wiki](https://github.com/HayaiApp/hayai/wiki) and current feature audit.
          required: true
        - label: I have checked through the app settings for my feature.
          required: true
        - label: I will fill out all of the requested information in this form.
          required: true
